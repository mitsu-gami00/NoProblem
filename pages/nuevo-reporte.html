<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo reporte – NoProblem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="fondo">
<div class="pagina">
  <header class="barra">
    <a class="logo" href="../index.html" aria-label="NoProblem, inicio">
      <svg viewBox="0 0 62 58" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="18" width="42" height="28" rx="4"/>
        <path d="M14 54h20M24 46v8"/>
        <path d="M14 31l7 7 13-14"/>
        <path d="M40 10a10 10 0 0 1 10 10M40 2a18 18 0 0 1 18 18" stroke-width="4"/>
      </svg>
      <span>No</span>Problem
    </a>
    <nav class="menu" aria-label="Principal">
      <a href="../index.html">Inicio</a>
      <a href="../pages/mis-reportes.html">Reportes</a>
      <a href="../pages/contacto.html">Contacto</a>
    </nav>
  </header>

  <main class="contenido">
    <form class="tarjeta reporte" action="../pages/confirmacion.html">
      <h1>Nuevo Reporte</h1>
      <p class="bajada">Describe el problema para que el equipo de soporte pueda ayudarte.</p>

      <label class="campo">
        <span>Tipo de problema</span>
        <select name="tipo" required>
          <option value="" selected disabled>Seleccionar categoría</option>
          <option>Proyector</option>
          <option>Computador</option>
          <option>Conexión a internet</option>
          <option>Otro</option>
        </select>
      </label>

      <label class="campo">
        <span>Ubicación</span>
        <input type="text" name="ubicacion" placeholder="Ej. Sala 3, laboratorio de computación">
      </label>

      <label class="campo">
        <span>Asunto</span>
        <input type="text" name="asunto" placeholder="Ej. El proyector no enciende">
      </label>

      <label class="campo">
        <span>Descripción del problema</span>
        <textarea name="descripcion" placeholder="Explica qué sucede y cuándo comenzó..."></textarea>
      </label>

      <label class="adjuntar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 6.5v10a4 4 0 0 1-8 0V6a2.7 2.7 0 0 1 5.4 0v10a1.4 1.4 0 0 1-2.8 0V7"/></svg>
        Adjuntar imagen (opcional)
        <small>Fotografía del equipo o del error</small>
        <input type="file" name="imagen" accept="image/*">
      </label>

      <div class="acciones">
        <a class="btn btn--gris" href="../index.html">Cancelar</a>
        <button class="btn" type="submit">Enviar reporte</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
