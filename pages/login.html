
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Chris Orellana">

    <title>NoProblem | Iniciar sesión</title>

    <link rel="stylesheet" href="../static/css/style.css">
    <script src="../static/js/script.js" defer></script>
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <nav class="navbar">

            <a href="../index.html" class="logo">NoProblem</a>

            <div class="nav-links">
                <a href="../index.html">Inicio</a>
                <a href="login.html" class="activo">Iniciar sesión</a>
                <a href="registro.html">Registrarse</a>
            </div>

        </nav>
    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="auth-container">

        <section class="auth-panel">

            <div class="auth-intro">

                <h1>Bienvenido nuevamente</h1>

                <p>
                    Inicia sesión para acceder a tu cuenta
                    y gestionar tus solicitudes de soporte.
                </p>

            </div>


            <!-- FORMULARIO DE LOGIN -->
            <form id="formularioLogin">

                <!-- CORREO -->
                <div class="form-grupo">

                    <label for="emailLogin">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="emailLogin"
                        name="email"
                        placeholder="ejemplo@correo.com"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->
                <div class="form-grupo">

                    <label for="passwordLogin">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="passwordLogin"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- RECUPERAR CONTRASEÑA -->
                <div class="auth-opciones">

                    <a href="#" id="recuperarPassword">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <!-- MENSAJE -->
                <div
                    id="mensajeLogin"
                    role="status"
                    aria-live="polite"
                ></div>


                <!-- BOTÓN -->
                <button
                    type="submit"
                    id="btnLogin"
                >
                    Iniciar sesión
                </button>

            </form>


            <!-- REGISTRO -->
            <div class="auth-footer">

                <p>
                    ¿Todavía no tienes una cuenta?
                    <a href="registro.html">Regístrate</a>
                </p>

            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="footer">

        <p>
            © 2026 NoProblem. Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
